<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="saharaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8B887;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4935A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A0622A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="soilGrad6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7A5230;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A2E10;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waterGrad6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD54F;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#FF8F00;stop-opacity:0.9" />
    </linearGradient>
    <radialGradient id="bgGrad6" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#FFF8F0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5EBDA;stop-opacity:1" />
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bgGrad6)" rx="12"/>
  <!-- Shadow -->
  <ellipse cx="200" cy="448" rx="92" ry="11" fill="rgba(0,0,0,0.12)"/>
  <!-- Amphora-style pot with handles -->
  <path d="M150 440 Q140 390 138 330 Q136 280 140 240 Q144 210 160 200 L240 200 Q256 210 260 240 Q264 280 262 330 Q260 390 250 440 Z" fill="url(#saharaGrad)"/>
  <!-- Handles -->
  <path d="M140 260 Q118 255 115 290 Q112 320 138 320" stroke="#C87840" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M260 260 Q282 255 285 290 Q288 320 262 320" stroke="#C87840" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- Rim -->
  <ellipse cx="200" cy="200" rx="82" ry="18" fill="#D4935A"/>
  <ellipse cx="200" cy="196" rx="77" ry="16" fill="#E8B887"/>
  <!-- Geometric pattern band -->
  <rect x="140" y="340" width="120" height="5" fill="rgba(255,255,255,0.3)"/>
  <path d="M140 352 L155 342 L170 352 L185 342 L200 352 L215 342 L230 352 L245 342 L260 352" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none"/>
  <rect x="140" y="360" width="120" height="5" fill="rgba(255,255,255,0.3)"/>
  <!-- Water indicator -->
  <rect x="248" y="270" width="10" height="110" rx="5" fill="rgba(255,255,255,0.25)"/>
  <rect x="249.5" y="325" width="7" height="53" rx="3.5" fill="url(#waterGrad6)"/>
  <!-- Soil -->
  <ellipse cx="200" cy="214" rx="73" ry="15" fill="url(#soilGrad6)"/>
  <!-- Cactus -->
  <rect x="196" y="140" width="8" height="78" rx="4" fill="#5D8A35"/>
  <!-- Cactus arms -->
  <path d="M200 175 Q175 170 170 155 Q165 142 175 138 Q185 134 188 148 Q192 162 200 165" stroke="#5D8A35" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M200 162 Q225 157 230 142 Q235 128 225 124 Q215 120 212 134 Q208 148 200 155" stroke="#6AAE3C" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Cactus spines -->
  <line x1="200" y1="155" x2="192" y2="150" stroke="#8DC65A" stroke-width="1"/>
  <line x1="200" y1="165" x2="208" y2="160" stroke="#8DC65A" stroke-width="1"/>
  <line x1="200" y1="175" x2="192" y2="170" stroke="#8DC65A" stroke-width="1"/>
  <line x1="200" y1="185" x2="208" y2="180" stroke="#8DC65A" stroke-width="1"/>
  <line x1="200" y1="195" x2="193" y2="190" stroke="#8DC65A" stroke-width="1"/>
  <!-- Cactus flower on top -->
  <circle cx="200" cy="135" r="10" fill="#FF6B6B"/>
  <circle cx="200" cy="135" r="6" fill="#FFD700"/>
  <!-- Small pebbles on soil -->
  <circle cx="175" cy="214" r="5" fill="#A08060"/>
  <circle cx="190" cy="217" r="4" fill="#B09070"/>
  <circle cx="218" cy="213" r="6" fill="#907050"/>
  <circle cx="232" cy="216" r="4" fill="#A08060"/>
  <!-- Label -->
  <rect x="148" y="374" width="104" height="40" rx="4" fill="rgba(0,0,0,0.12)"/>
  <text x="200" y="391" text-anchor="middle" font-family="serif" font-size="10" fill="white" font-weight="bold">SAHARA DREAM</text>
  <text x="200" y="407" text-anchor="middle" font-family="sans-serif" font-size="8" fill="rgba(255,255,255,0.85)">self-watering</text>
</svg>
