<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="jungleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2E7D32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B5E20;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="soilGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3E2723;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A0F0A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waterGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#80CBC4;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#00897B;stop-opacity:0.9" />
    </linearGradient>
    <radialGradient id="bgGrad4" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#F1F8E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8F5E9;stop-opacity:1" />
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bgGrad4)" rx="12"/>
  <!-- Shadow -->
  <ellipse cx="200" cy="450" rx="88" ry="11" fill="rgba(0,0,0,0.13)"/>
  <!-- Wide bowl pot shape -->
  <path d="M105 438 Q100 380 102 310 L108 225 Q112 205 130 198 L270 198 Q288 205 292 225 L298 310 Q300 380 295 438 Z" fill="url(#jungleGrad)"/>
  <!-- Pot highlight -->
  <path d="M108 225 Q200 215 292 225 L290 240 Q200 230 110 240 Z" fill="rgba(255,255,255,0.15)"/>
  <!-- Woven texture pattern -->
  <path d="M110 270 Q200 260 290 270 M110 300 Q200 290 290 300 M110 330 Q200 318 290 330" stroke="rgba(0,0,0,0.15)" stroke-width="1.5" fill="none"/>
  <path d="M135 225 L125 438 M165 218 L158 438 M200 215 L200 438 M235 218 L242 438 M265 225 L275 438" stroke="rgba(0,0,0,0.1)" stroke-width="1" fill="none"/>
  <!-- Rim -->
  <ellipse cx="200" cy="200" rx="97" ry="20" fill="#388E3C"/>
  <ellipse cx="200" cy="196" rx="92" ry="18" fill="#43A047"/>
  <!-- Water indicator -->
  <rect x="278" y="275" width="11" height="115" rx="5.5" fill="rgba(0,0,0,0.2)"/>
  <rect x="279.5" y="318" width="8" height="70" rx="4" fill="url(#waterGrad4)"/>
  <!-- Soil -->
  <ellipse cx="200" cy="214" rx="87" ry="17" fill="url(#soilGrad4)"/>
  <!-- Tropical plant - bird of paradise style -->
  <path d="M195 214 Q192 190 188 165 Q184 138 188 110" stroke="#2E7D32" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M205 214 Q208 188 212 160 Q216 132 212 105" stroke="#1B5E20" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M185 214 Q178 194 172 178" stroke="#33691E" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Large tropical leaves -->
  <path d="M188 110 Q155 80 130 95 Q120 110 140 120 Q160 115 165 130 Q188 118 188 110 Z" fill="#43A047"/>
  <path d="M212 105 Q245 75 268 92 Q278 108 258 116 Q238 113 235 128 Q212 114 212 105 Z" fill="#388E3C"/>
  <path d="M172 178 Q145 165 132 178 Q128 190 140 196 Q155 192 160 202 Q172 192 172 178 Z" fill="#558B2F"/>
  <!-- Leaf veins -->
  <path d="M188 110 Q160 98 140 112" stroke="rgba(255,255,255,0.3)" stroke-width="1" fill="none"/>
  <path d="M212 105 Q240 93 260 108" stroke="rgba(255,255,255,0.3)" stroke-width="1" fill="none"/>
  <!-- Label -->
  <rect x="148" y="345" width="104" height="42" rx="4" fill="rgba(0,0,0,0.2)"/>
  <text x="200" y="363" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white" font-weight="bold">JUNGLE SOUL</text>
  <text x="200" y="379" text-anchor="middle" font-family="sans-serif" font-size="8" fill="rgba(255,255,255,0.85)">self-watering</text>
</svg>
