<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="marbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F5F5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E0E0E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BDBDBD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="soilGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6D4C41;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4E342E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waterGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#80DEEA;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#00ACC1;stop-opacity:0.9" />
    </linearGradient>
    <radialGradient id="bgGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FAF8F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EDE9E3;stop-opacity:1" />
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bgGrad2)" rx="12"/>
  <!-- Shadow -->
  <ellipse cx="200" cy="445" rx="95" ry="12" fill="rgba(0,0,0,0.12)"/>
  <!-- Pot - cylindrical marble shape -->
  <path d="M110 435 Q105 370 108 290 L112 210 Q115 195 130 188 L270 188 Q285 195 288 210 L292 290 Q295 370 290 435 Z" fill="url(#marbleGrad)"/>
  <!-- Marble veins -->
  <path d="M130 220 Q160 230 180 250 Q200 270 230 260 Q250 255 270 270" stroke="rgba(150,150,150,0.4)" stroke-width="1.5" fill="none"/>
  <path d="M120 300 Q145 290 165 310 Q185 330 210 320 Q235 310 260 325" stroke="rgba(150,150,150,0.35)" stroke-width="1" fill="none"/>
  <path d="M115 370 Q140 355 160 375 Q180 395 220 380 Q245 370 275 385" stroke="rgba(150,150,150,0.3)" stroke-width="1" fill="none"/>
  <!-- Pot rim -->
  <ellipse cx="200" cy="190" rx="90" ry="20" fill="#E8E8E8"/>
  <ellipse cx="200" cy="186" rx="85" ry="18" fill="#F0F0F0"/>
  <!-- Water indicator -->
  <rect x="275" y="270" width="10" height="110" rx="5" fill="rgba(0,0,0,0.1)"/>
  <rect x="276.5" y="320" width="7" height="58" rx="3.5" fill="url(#waterGrad2)"/>
  <!-- Soil -->
  <ellipse cx="200" cy="205" rx="80" ry="16" fill="url(#soilGrad2)"/>
  <!-- Monstera plant -->
  <path d="M200 205 Q198 175 195 155" stroke="#5D4037" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M195 155 Q190 120 175 90" stroke="#4CAF50" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M195 155 Q205 125 220 105" stroke="#388E3C" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Monstera leaves with holes -->
  <path d="M175 90 Q145 70 130 85 Q125 100 140 110 Q155 105 160 115 Q165 125 155 130 Q168 128 175 115 Q185 100 175 90 Z" fill="#43A047"/>
  <circle cx="150" cy="98" r="6" fill="url(#bgGrad2)"/>
  <path d="M220 105 Q240 80 255 90 Q265 105 255 118 Q245 115 240 125 Q235 130 225 125 Q215 118 220 105 Z" fill="#388E3C"/>
  <circle cx="242" cy="105" r="5" fill="url(#bgGrad2)"/>
  <!-- Bottom plate -->
  <ellipse cx="200" cy="435" rx="100" ry="10" fill="#D0D0D0"/>
  <!-- Label -->
  <rect x="145" y="340" width="110" height="42" rx="4" fill="rgba(0,0,0,0.08)"/>
  <text x="200" y="358" text-anchor="middle" font-family="serif" font-size="10" fill="#555" font-weight="bold">MARBLE OASIS</text>
  <text x="200" y="374" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#777">self-watering</text>
</svg>
