<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="potGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C27B5A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B4513;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="soilGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5D4037;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3E2723;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waterGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0288D1;stop-opacity:0.8" />
    </linearGradient>
    <radialGradient id="bgGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#F5EFE6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8DDD0;stop-opacity:1" />
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGrad1)" rx="12"/>
  <!-- Shadow -->
  <ellipse cx="200" cy="440" rx="90" ry="12" fill="rgba(0,0,0,0.15)"/>
  <!-- Pot body - terracotta tapered shape -->
  <path d="M120 430 Q110 380 105 320 L110 240 Q115 210 135 200 L265 200 Q285 210 290 240 L295 320 Q290 380 280 430 Z" fill="url(#potGrad1)"/>
  <!-- Pot rim -->
  <ellipse cx="200" cy="200" rx="75" ry="18" fill="#D4896A"/>
  <ellipse cx="200" cy="195" rx="70" ry="16" fill="#C27B5A"/>
  <!-- Water reservoir indicator strip -->
  <rect x="270" y="280" width="12" height="100" rx="6" fill="rgba(255,255,255,0.3)"/>
  <rect x="272" y="330" width="8" height="48" rx="4" fill="url(#waterGrad1)"/>
  <!-- Soil -->
  <ellipse cx="200" cy="215" rx="65" ry="14" fill="url(#soilGrad1)"/>
  <!-- Plant stems -->
  <path d="M200 215 Q195 180 185 150 Q175 120 190 100" stroke="#4CAF50" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M200 215 Q210 175 215 145 Q220 115 205 95" stroke="#388E3C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M200 215 Q188 185 180 165" stroke="#66BB6A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Leaves -->
  <ellipse cx="185" cy="135" rx="22" ry="12" fill="#66BB6A" transform="rotate(-30 185 135)"/>
  <ellipse cx="207" cy="120" rx="20" ry="11" fill="#4CAF50" transform="rotate(15 207 120)"/>
  <ellipse cx="175" cy="155" rx="18" ry="9" fill="#81C784" transform="rotate(-45 175 155)"/>
  <ellipse cx="192" cy="100" rx="16" ry="9" fill="#388E3C" transform="rotate(20 192 100)"/>
  <!-- Pot texture lines -->
  <path d="M130 280 Q200 270 270 280" stroke="rgba(255,255,255,0.2)" stroke-width="1" fill="none"/>
  <path d="M125 320 Q200 308 275 320" stroke="rgba(255,255,255,0.15)" stroke-width="1" fill="none"/>
  <!-- Label -->
  <rect x="150" y="340" width="100" height="40" rx="4" fill="rgba(255,255,255,0.25)"/>
  <text x="200" y="358" text-anchor="middle" font-family="serif" font-size="10" fill="white" font-weight="bold">TERRA FLOW</text>
  <text x="200" y="373" text-anchor="middle" font-family="sans-serif" font-size="8" fill="rgba(255,255,255,0.9)">self-watering</text>
</svg>
